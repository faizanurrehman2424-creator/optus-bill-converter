<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Optus Bill AI Converter (Heavy)</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .upload-box { border: 2px dashed #ccc; padding: 40px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .upload-box:hover { border-color: #4ba289; background: #f9fff9; }
        button { background: #4ba289; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .progress-container { margin-top: 20px; display: none; text-align: left; }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .progress-fill { height: 100%; background: #4ba289; width: 0%; transition: width 0.3s; }
        .log-box { height: 150px; overflow-y: auto; background: #f8f9fa; border: 1px solid #ddd; margin-top: 15px; padding: 10px; font-family: monospace; font-size: 12px; text-align: left; border-radius: 5px; }
        .warning { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Optus Bill AI Converter</h1>
        <div class="warning">⚠️ High Accuracy Mode. This may take 4-5 minutes per chunk. Do not close tab.</div>
        
        <input type="file" id="pdfInput" accept=".pdf" style="display:none">
        <div class="upload-box" onclick="document.getElementById('pdfInput').click()">
            <span id="fileName">Click to select PDF</span>
        </div>

        <div class="progress-container" id="progressContainer">
            <div style="display:flex; justify-content:space-between;">
                <span id="statusText">Preparing...</span>
                <span id="percentText">0%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="log-box" id="logBox"></div>
        </div>

        <button id="convertBtn" onclick="startProcess()" disabled>Start Extraction</button>
        <button id="downloadBtn" style="display:none; background:#007bff;" onclick="downloadCSV()">📥 Download CSV</button>
    </div>

    <script>
        let selectedFile = null;
        let allRecords = [];
        let serverFilename = "";
        let originalFilename = "";

        const log = (msg) => {
            const box = document.getElementById('logBox');
            box.innerHTML += `<div>${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        };

        document.getElementById('pdfInput').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                document.getElementById('fileName').innerText = selectedFile.name;
                document.getElementById('convertBtn').disabled = false;
            }
        });

        async function startProcess() {
            document.getElementById('convertBtn').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'block';
            
            // 1. Upload File
            log("Uploading PDF to server...");
            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const uploadRes = await fetch('/upload', { method: 'POST', body: formData });
                const uploadData = await uploadRes.json();
                
                if (uploadData.error) throw new Error(uploadData.error);
                
                serverFilename = uploadData.filename;
                originalFilename = uploadData.original_name;
                const totalPages = uploadData.total_pages;
                
                log(`Upload complete. Total pages: ${totalPages}`);
                
                // --- HEAVY CONFIG ---
                const chunkSize = 5; 
                const overlap = 1;
                const step = chunkSize - overlap;
                
                for (let i = 0; i < totalPages; i += step) {
                    let start = i;
                    let end = Math.min(i + chunkSize, totalPages);
                    
                    if (start >= totalPages) break;
                    if (i > 0 && end === totalPages && (end - start) < 2) continue;

                    log(`Processing pages ${start+1} to ${end} (Sending to Gemini)...`);
                    
                    const chunkRes = await fetch('/process_chunk', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            filename: serverFilename,
                            original_name: originalFilename,
                            start: start,
                            end: end
                        })
                    });
                    
                    const chunkJson = await chunkRes.json();
                    if (chunkJson.data) {
                        allRecords.push(...chunkJson.data);
                        log(`✓ Found ${chunkJson.data.length} rows`);
                    } else if (chunkJson.error) {
                         log(`× Error: ${chunkJson.error}`);
                    }
                    
                    const progress = Math.min(100, Math.round((end / totalPages) * 100));
                    document.getElementById('progressFill').style.width = `${progress}%`;
                    document.getElementById('percentText').innerText = `${progress}%`;
                }

                log("Processing complete. Deduplicating...");
                finishProcess();

            } catch (err) {
                log(`ERROR: ${err.message}`);
                alert("An error occurred. Check logs.");
            }
        }

        function finishProcess() {
            const unique = new Map();
            allRecords.forEach(r => unique.set(r['Row External Id'], r));
            const finalData = Array.from(unique.values());
            
            log(`Final clean count: ${finalData.length} rows`);
            document.getElementById('statusText').innerText = "Done!";
            
            if (finalData.length === 0) {
                alert("No data found!");
                return;
            }
            
            const headers = Object.keys(finalData[0]);
            const csvContent = [
                headers.join(','),
                ...finalData.map(row => headers.map(h => `"${row[h]}"`).join(','))
            ].join('\n');
            
            window.csvBlob = new Blob([csvContent], { type: 'text/csv' });
            document.getElementById('downloadBtn').style.display = 'inline-block';
        }

        function downloadCSV() {
            const url = URL.createObjectURL(window.csvBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = originalFilename.replace('.pdf', '_final.csv');
            a.click();
        }
    </script>
</body>
</html>
